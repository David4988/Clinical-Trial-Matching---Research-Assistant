[alembic]
script_location = app/db/alembic
prepend_sys_path = .

# The URL is supplied at runtime by app/db/alembic/env.py, reading
# MIGRATION_DATABASE_URL (falling back to DATABASE_URL) exactly as
# docs/FINAL_IMPLEMENTATION_PLAN.md §10.5 specifies — never hardcoded here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
